name: p01-bank-call-targeting

on:
  push:
    branches: [main]
    paths:
      - "projects/01-bank-call-targeting/**"
      - ".github/workflows/p01-ci.yml"
  pull_request:
    paths:
      - "projects/01-bank-call-targeting/**"
      - ".github/workflows/p01-ci.yml"

permissions:
  contents: read

jobs:
  tests-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/01-bank-call-targeting
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: projects/01-bank-call-targeting/requirements.txt

      - name: Install the pinned requirements, nothing else
        run: python -m pip install -r requirements.txt

      # RUN_SLOW=1 switches on tests/test_run_sh.py, which runs run.sh for real:
      # it downloads the UCI file, runs every step and must exit 0 without touching the test set.
      - name: Tests, including run.sh
        env:
          RUN_SLOW: "1"
        run: python -m pytest -q

      # run.sh has just written outputs/, so the README numbers can be checked against them.
      - name: README numbers match the saved results
        run: python src/check_readme.py
