name: p02-memecoin-launch-risk

on:
  push:
    branches: [main]
    paths:
      - "projects/02-memecoin-launch-risk/**"
      - ".github/workflows/p02-ci.yml"
  pull_request:
    paths:
      - "projects/02-memecoin-launch-risk/**"
      - ".github/workflows/p02-ci.yml"

permissions:
  contents: read

jobs:
  tests-and-run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: projects/02-memecoin-launch-risk
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: projects/02-memecoin-launch-risk/requirements.txt

      - name: Install the pinned requirements, nothing else
        run: python -m pip install -r requirements.txt

      # CI cannot download the real data (feature.pkl is a 500 MB Google Drive file), so it runs the
      # whole pipeline on MADE-UP data. That proves every step runs and hangs together; the numbers
      # mean nothing. RUN_SLOW=1 switches on tests/test_run_sh.py, which runs `bash run.sh --sample`
      # for real and checks it exits 0, never opens the test pile, and changes no committed file.
      - name: Tests, including run.sh on made-up data
        env:
          RUN_SLOW: "1"
        run: python -m pytest -q
