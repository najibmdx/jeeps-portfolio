# What each of the 122 tabular columns is, and whether it is known at the moment of migration.
# Written from the authors' feature code (git-disl/MELT, src/feat_gen.py, master, read 24 Nov 2026).
# We do NOT have the raw transaction files, so every "known_at_migration" rests on reading that code.
#
# known_at_migration:
#   code_read   the code builds it only from transactions up to migration
#   unverified  it also depends on a file we do not have; the timing cannot be checked
# watch (free text, may be empty):
#   clock            may tell the model WHEN the coin launched, not anything about the coin
#   clock_possible   may drift with time (checked by the audit, not assumed)
#   zero_placeholder a 0 can mean "no data", not a real zero
#
# Review these lines yourself. The decision in your own words goes in decision_log.md.

group1_price:
  group: group1
  meaning: SOL price for the hour in which the coin migrates (from the authors' hourly SOL price file).
  known_at_migration: unverified
  why: The hourly price file is not in our data. If the value is the hour's close or average, it includes up to 59 minutes after migration.
  watch: clock
group1_migrate_year:
  group: group1
  meaning: Migration year (UTC).
  known_at_migration: code_read
  why: Taken from the timestamp of the coin's last pre-migration transaction, which the authors treat as the migration time.
  watch: clock
group1_migrate_month:
  group: group1
  meaning: Migration month (UTC).
  known_at_migration: code_read
  why: Taken from the timestamp of the coin's last pre-migration transaction, which the authors treat as the migration time. Train covers December and January only, so a model using month meets February values it never saw on test.
  watch: clock
group1_migrate_day:
  group: group1
  meaning: Migration day of the month (UTC).
  known_at_migration: code_read
  why: Taken from the timestamp of the coin's last pre-migration transaction, which the authors treat as the migration time.
