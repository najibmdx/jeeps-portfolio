  meaning: How unequal the holdings are among wallets holding at least 1 token (0 = equal, 1 = one wallet holds all).
  known_at_migration: code_read
  why: Built in the authors' code only from the coin's transactions up to migration. We read the code; we do not have the raw transaction files.
  watch: ''
