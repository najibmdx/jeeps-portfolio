# Settings for project 03 (Prediction Market Resolution). Change these instead of editing the code.
# Learning project. No claim about trading use, returns or profit.
# Every number here is a decision made in the design record (24 Nov 2026). The only tuning is the small grids under models.tuning (Stage 7).

question:
  # The label: does the Yes side of a market win?
  label_table: predictions
  label_column: winner            # read on the Yes token
  # Where markets.outcome_yes is filled in, it must agree with the label above.
  cross_check: {table: markets, column: outcome_yes}
  outcomes: ["Yes", "No"]           # only markets with exactly these two outcomes
  n_outcomes: 2                   # and exactly one winning token

decision_time:
  # t = the market's opening date (cut to midnight UTC) + this many days.
  days_after_open: 7              # main run
  robustness_days_after_open: 3   # the same pipeline rerun, validation numbers only
  # A market only counts if it is still open at t. close_time is used for THIS check and nowhere else.
  # It looks like the realized end of the market, so it is never a feature.
  must_be_open_at_t: true
  bars_strictly_before_t: true    # daily bars dated on or after t are never used

universe:
  min_trades_before_t: 20         # a trade count, not volume: the volume unit is unconfirmed
  # The contested slice: last close before t between these two lines. Reported next to "all markets".
  contested_low: 0.05
  contested_high: 0.95

split:
  # Order markets by t, oldest first. Oldest share is train, next is validation, newest is test.
  order_by: t
  train: 0.6
  validation: 0.2
  test: 0.2                       # opened once
  # Markets whose outcome was not yet known when the next period starts are purged from train and validation.
  purge_unknown_labels: true
  # An event goes wholly to the split of its earliest market.
  events_whole: true

seed: 42   # fixed so that every run gives the same numbers

data:
  source: https://huggingface.co/datasets/vgregoire/polymarket-users
  licence: "CC-BY-4.0 for the authors' processing. Fields that come from the Polymarket API stay under Polymarket's terms."
  citation: "Akey, P., Gregoire, V., Harvie, N., and Martineau, C. (2026). Who Wins and Who Loses In Prediction Markets? Evidence from Polymarket. Working paper."
  # Expected file sizes were read from the Hugging Face file listing and from the downloaded files.
  # sha256 was computed in Stage 1 on the files as downloaded from Hugging Face. download.py checks every download
  # against these, so a changed or damaged file is caught before anything uses it.
  files:
    events:
      file: events.parquet
      bytes: 7581274
      sha256: 634dc8f45bd88d8d742d9d8bdf564fbe98b0d7b4b004283fd3103a2e72882dce
      url: https://huggingface.co/datasets/vgregoire/polymarket-users/resolve/main/events.parquet
    markets:
      file: markets.parquet
      bytes: 22591844
      sha256: ca0a8438097fa830a2f94025e46196f4ff7a803656419e041f5c86c081c4a723
      url: https://huggingface.co/datasets/vgregoire/polymarket-users/resolve/main/markets.parquet
    predictions:
      file: predictions.parquet
      bytes: 119721790
      sha256: 4c429f43f5f40bab17dad2634e113cadc7cc27f1989654fcc4142bd04fe71119
      url: https://huggingface.co/datasets/vgregoire/polymarket-users/resolve/main/predictions.parquet
    ohlcv_1d:
      file: ohlcv_1d.parquet
      bytes: 161540522
      sha256: 5dfd3de7449e795eb8bd8b0d76329c634414109b0a1da489059236dbc37a58e7
      url: https://huggingface.co/datasets/vgregoire/polymarket-users/resolve/main/ohlcv_1d.parquet

features:
  # All of these are built from daily bars strictly before t.
  price_path: [last_close, first_open, high, low, mean_close, change_first_to_last, n_bars, days_since_last_bar]
  activity: [trades_before_t, trades_last_bar]
  # sibling_count_at_t counts markets of the same event opened on or before t. It is derived from open times,
  # never taken from events.n_questions (that field includes markets added later).
  context: [category, sibling_count_at_t, has_fee]
  # Timing could not be verified. Tested once as a labelled ablation, never in the main model.
  held_back: [expiration_time]
  # Never allowed: they describe the future of the market (or hold it).
  excluded: [close_time, events.volume, events.open_interest, events.n_questions]

dataset:
  # The built table: one row per market in the universe. Written to <data folder>/derived/. Never committed.
  folder: derived
  file: dataset_k{k}.parquet
  # The three split files written by Stage 3 ({part} is train, validation or test). Never committed.
  split_file: "{part}_k{k}.parquet"
  # Columns that identify the row or are needed later for splitting and purging. Never model inputs.
  # expiration_time sits here only because it is held back for one labelled ablation (Stage 8).
  meta: [market_id, event_key, t, open_time, close_time, expiration_time, label]
  # Definitions, for the record:
  #   last_close / first_open / high / low / mean_close: Yes-token daily bars dated strictly before t
  #   change_first_to_last = last_close - first_open;  n_bars = number of such bars
  #   days_since_last_bar = whole days from the last such bar's date to t
  #   trades_before_t = sum of trade_count over those bars;  trades_last_bar = trade_count of the last one
  #   sibling_count_at_t = markets of the same event (this one included) that opened on or before t
  #   event_key = event_id, or the market's own id when event_id is missing (9 markets)

leakage:
  # Stage 4 screens 1 to 3 run on the TRAIN part only. Screen 4 compares train with validation, features only (no labels).
  # A flag is a finding to discuss. Nothing is dropped automatically.
  # Screen 1: a group of train markets whose outcome never varies (all Yes or all No) is flagged, but only if the
  # group is big enough to mean something. The event minimum matters because one huge event can be 50 markets.
  min_markets_in_segment: 50
  min_events_in_segment: 10
  # Screen 2: a numeric feature whose rank correlation with t is at least this (up or down) is flagged as clock-like.
  clock_like_correlation: 0.5
  # Upper ends of the sibling-count groups: 1, 2 to 5, 6 to 15, 16 and more (the groups of the design record).
  sibling_bucket_edges: [1, 5, 15]
  # Screen 4, train versus validation, features only. A number feature is flagged if its validation mean sits at least
  # this many train standard deviations from its train mean. A yes/no or category feature is flagged if the share of
  # any value changes by at least this much (0.10 = 10 percentage points). Round numbers, not tuned to the data.
  # A flag means validation looks different from train (expected with a split by time), not that anything leaked.
  shift_number_difference: 0.5
  shift_share_change: 0.10
  # Screen 3 is not recomputed here: it needs bars after t, which the dataset does not hold. It is cited from
  # audit_expected.final_bar_predicts_outcome, which audit.py reproduced on real data in Stage 1.

# Every column of the built dataset, and every field that is kept out, with its source and a "known at t" decision.
#   known_at_t: "yes" (known at t), "assumed" (believed fixed from opening, not verified), "no" (describes the future
#   or is the outcome), "unverified" (timing could not be checked). Quoted on purpose: YAML reads a bare yes or no
#   as true or false. A model input must be "yes" or "assumed". role: feature, meta, held_back or excluded.
leakage_table:
  market_id: {role: meta, source: "markets.market_id", known_at_t: "yes", reason: "Row identifier. Never a model input."}
  event_key: {role: meta, source: "markets.event_id, or the market's own id when it has none", known_at_t: "yes", reason: "Groups the markets of one event for the split and for the wobble. Never a model input."}
  t: {role: meta, source: "derived: markets.market_start_time cut to midnight UTC, plus k days", known_at_t: "yes", reason: "The decision time itself. Never a model input: it is a clock."}
  open_time: {role: meta, source: "markets.market_start_time", known_at_t: "yes", reason: "Known once the market opens. Kept to build t and the sibling count. Never a model input: it is a clock."}
  close_time: {role: excluded, source: "markets.close_time", known_at_t: "no", reason: "Looks like the realized end of the market (after expiration_time in 78% of binary markets). Kept in the table only for the open-at-t check and the purge. Never a model input."}
  expiration_time: {role: held_back, source: "markets.expiration_time", known_at_t: "unverified", reason: "Looks scheduled (96.6% exactly on the hour) but may have been edited after the market opened. Tested once as a labelled ablation, never in the main model."}
  label: {role: meta, source: "predictions.winner on the Yes token", known_at_t: "no", reason: "The outcome being forecast."}
  last_close: {role: feature, source: "ohlcv_1d.close of the last Yes-token daily bar dated before t", known_at_t: "yes", reason: "Bars strictly before t only."}
  first_open: {role: feature, source: "ohlcv_1d.open of the first Yes-token daily bar", known_at_t: "yes", reason: "Bars strictly before t only."}
  high: {role: feature, source: "highest ohlcv_1d.high over those bars", known_at_t: "yes", reason: "Bars strictly before t only."}
  low: {role: feature, source: "lowest ohlcv_1d.low over those bars", known_at_t: "yes", reason: "Bars strictly before t only."}
  mean_close: {role: feature, source: "mean of ohlcv_1d.close over those bars", known_at_t: "yes", reason: "Bars strictly before t only."}
  change_first_to_last: {role: feature, source: "derived: last_close minus first_open", known_at_t: "yes", reason: "Built from two features that are known at t."}
  n_bars: {role: feature, source: "number of those bars", known_at_t: "yes", reason: "Bars strictly before t only."}
  days_since_last_bar: {role: feature, source: "derived: whole days from the last bar's date to t", known_at_t: "yes", reason: "Uses only the last bar before t and t itself."}
  trades_before_t: {role: feature, source: "sum of ohlcv_1d.trade_count over those bars", known_at_t: "yes", reason: "Bars strictly before t only."}
  trades_last_bar: {role: feature, source: "ohlcv_1d.trade_count of the last bar before t", known_at_t: "yes", reason: "Bars strictly before t only."}
  category: {role: feature, source: "markets.category", known_at_t: "assumed", reason: "From the authors' classifier. Assumed fixed from the market's opening. Not verified."}
  sibling_count_at_t: {role: feature, source: "derived from markets.market_start_time of the markets of the same event", known_at_t: "yes", reason: "Counts only markets opened on or before t. Taken from open times, never from events.n_questions."}
  has_fee: {role: feature, source: "markets.has_fee", known_at_t: "assumed", reason: "A market attribute, assumed fixed from the market's opening. Not verified."}
  events.volume: {role: excluded, source: "events.volume", known_at_t: "no", reason: "Excluded for good in the design record: it describes the market's future, not its first days."}
  events.open_interest: {role: excluded, source: "events.open_interest", known_at_t: "no", reason: "Excluded for good in the design record: it describes the market's future, not its first days."}
  events.n_questions: {role: excluded, source: "events.n_questions", known_at_t: "no", reason: "Counts markets that were added to the event after t, so it holds the future."}

baselines:
  # The market price is already a good forecast, so it is the thing to beat.
  - raw_price                     # the last close before t, used as the probability of Yes
  - price_only_correction         # a tiny model on the price alone, fitted on train
  - base_rate                     # the share of Yes in train, for every market

metrics:
  decides: log_loss               # lower is better
  also: [brier, calibration_table]
  slices: [all, contested]
  # Every forecast is clipped into [price_clip, 1 - price_clip] before scoring, so a price of exactly 0 or 1 that meets
  # the other outcome costs about 6.9 (log loss), not infinity. The same clip for all three baselines.
  price_clip: 0.001
  # Fixed price bands for the calibration table: [low, high), the last band includes 1. They line up with the contested line.
  calibration_bands: [0, 0.05, 0.1, 0.2, 0.3, 0.5, 0.7, 0.95, 1.0]

models:
  # A ladder: each step adds one thing.
  ladder: [lr_price_only, lr_all_features, random_forest, gradient_boosting]
  selection: lowest_validation_log_loss
  # Stage 6: untuned. Library defaults and the seed above, except these two settings.
  forest_trees: 300
  logistic_max_iter: 1000
  # Model inputs left out, with the reason. They stay in leakage_table. Decided with Jeeps on 24 Nov 2026.
  dropped_features:
    has_fee: "True for 6 of 23,897 train markets and about none of validation, so nothing can be learned or tuned; the 1,349 fee markets of the universe are in the test period."
  # The logistic regression sees these price levels as log-odds, so it starts from the same input as the price-only rung.
  log_odds_columns: [last_close, first_open, high, low, mean_close]
  frozen_file: frozen_choice.yaml   # in the project folder. Committed BEFORE the test split is opened.
  test_lock_file: test_opened.lock  # inside data/. Written the moment the test split is opened.
  # Stage 7: light tuning on validation. Same budget for every model: 6 settings each. Each grid holds the library
  # default (C 1, leaf 1 for the forest, learning rate 0.1 with leaf 20 for boosting), so tuning cannot come out worse
  # than untuned on validation. lr_price_only has nothing to tune. forest_trees stays as set above.
  # Grids are listed from the SIMPLEST setting to the most flexible, and the first of equals wins a tie:
  #   C and learning_rate ascending (stronger regularisation, slower learning first), min_samples_leaf descending (bigger leaves first).
  # Several settings per model (boosting): the first value of the first setting changes slowest, as listed below.
  tuning:
    lr_all_features: {C: [0.001, 0.01, 0.1, 1.0, 10.0, 100.0]}
    random_forest: {min_samples_leaf: [200, 100, 50, 20, 5, 1]}
    gradient_boosting: {learning_rate: [0.03, 0.1], min_samples_leaf: [400, 100, 20]}

# Stage 8: column-group ablations. Validation only; the test split is never read. The model is the FROZEN choice
# (frozen_choice.yaml): same model, same settings in every row, refitted on train on a subset of the columns. Nothing is
# retuned (retuning per row would measure tuning effort, not columns), and nothing here can change the frozen choice.
ablation:
  # The model inputs in three groups. Every input (has_fee is dropped, see models.dropped_features) sits in exactly one.
  groups:
    price_path: [last_close, first_open, high, low, mean_close, change_first_to_last]
    activity: [n_bars, days_since_last_bar, trades_before_t, trades_last_bar]
    context: [category, sibling_count_at_t]
  # The rows, in the order printed. Each is a list of model inputs. The row all_columns is the frozen model itself and
  # must reproduce its validation score in frozen_choice.yaml (the run stops if it does not). Every row keeps the price path.
  rows:
    price_path_only: [last_close, first_open, high, low, mean_close, change_first_to_last]
    price_path_plus_activity: [last_close, first_open, high, low, mean_close, change_first_to_last, n_bars, days_since_last_bar, trades_before_t, trades_last_bar]
    price_path_plus_category: [last_close, first_open, high, low, mean_close, change_first_to_last, category]
    price_path_plus_sibling_count: [last_close, first_open, high, low, mean_close, change_first_to_last, sibling_count_at_t]
    all_minus_sibling_count: [last_close, first_open, high, low, mean_close, change_first_to_last, n_bars, days_since_last_bar, trades_before_t, trades_last_bar, category]
    all_columns: [last_close, first_open, high, low, mean_close, change_first_to_last, n_bars, days_since_last_bar, trades_before_t, trades_last_bar, category, sibling_count_at_t]
  # Paired differences, A minus B (negative = A has the lower log loss). lr_price_only is the Stage 5 price correction.
  # The sibling-count answers: price_path_plus_sibling_count minus price_path_only, and all_columns minus all_minus_sibling_count.
  pairs:
    - [price_path_only, lr_price_only]
    - [price_path_plus_activity, lr_price_only]
    - [price_path_plus_category, lr_price_only]
    - [price_path_plus_sibling_count, lr_price_only]
    - [all_minus_sibling_count, lr_price_only]
    - [all_columns, lr_price_only]
    - [price_path_only, all_columns]
    - [price_path_plus_activity, all_columns]
    - [price_path_plus_category, all_columns]
    - [price_path_plus_sibling_count, all_columns]
    - [price_path_plus_activity, price_path_only]
    - [price_path_plus_category, price_path_only]
    - [price_path_plus_sibling_count, price_path_only]
    - [all_columns, all_minus_sibling_count]
  # If the frozen all_columns score is not reproduced to this many log-loss units, the run stops.
  reproduce_tolerance: 1.0e-7

# Stage 9: the one-time test (src/final_test.py --confirm-open-test). The rules below were fixed with Jeeps on 25 Nov 2026,
# before the test split was opened. The test is opened once, with a lock file (models.test_lock_file); nothing is retuned afterwards.
final_test:
  expected_test_markets: 8991     # Stage 3 (final test size after events are kept whole). The run stops if the split report says otherwise.
  reproduce_tolerance: 1.0e-7     # the frozen model, refitted on train, must reproduce its validation score in frozen_choice.yaml to this
  headline_slice: contested       # the headline is this slice (all-markets scores are flattered by near-decided markets); the other slice is shown beside it
  window_percentiles: [50, 90, 99]  # of days from t to close, for the test-window (censoring) check
  # What the headline says, by the verdict of the paired difference against the raw price (log loss, whole events re-drawn).
  readings:
    better: "Better than the market price in this test window. One window only."
    cannot be told apart: "No measurable difference from the market price in this test window."
    worse: "Worse than the market price in this test window."

evaluation:
  outputs_folder: outputs
  # The wobble: re-draw the validation set this many times by resampling whole events, show the middle share of the results.
  bootstrap_draws: 200
  interval: 0.90

# What the audit must find in the real data (src/audit.py compares against this and stops on any difference).
# First computed in Claude's sandbox on 24 Nov 2026; Jeeps's own run is the check. Contested means
# contested_low <= last close before t < contested_high, so near-decided and contested add up to the universe.
