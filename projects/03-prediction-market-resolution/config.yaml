  rows: {events: 316429, markets: 729133, predictions: 1458223, ohlcv_1d: 4765439}
  markets_with_exactly_one_winner: 667794
  markets_with_no_winner: 61270
  markets_with_two_or_more_winners: 0
  binary_markets: 218089
  binary_yes_rate: 0.2729
  outcome_yes_compared: 218089
  outcome_yes_disagreements: 0
  close_after_expiration: 170397
  close_before_expiration: 46247
  final_bar_predicts_outcome: 0.9895
  open_at_t: 101268
  with_bars_before_t: 72457
  universe: 43881
  universe_events: 10752
  universe_yes_rate: 0.1881
  contested: 17071
  near_decided: 26810
  universe_fee_flag: 1349
  expiration_null: 448
