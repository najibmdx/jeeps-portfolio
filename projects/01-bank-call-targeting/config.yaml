# Settings for project 01. Change these instead of editing the code.

split:
  train_end: 200904   # last month of the training set (YYYYMM)
  valid_end: 200905   # last month of the validation set; every later month is test

features:
  # Options: client, contact, history, calendar, economy.
  # calendar and economy are held back for the ablation study (see src/columns.py).
  groups: [client, contact, history]

seed: 42   # fixed so that every run gives the same numbers

models:
  logistic_regression:
    max_iter: 1000
  random_forest:
    n_estimators: 300
    min_samples_leaf: 20
    n_jobs: -1
  gradient_boosting:
    max_iter: 200
    learning_rate: 0.05

evaluation:
  top_k: 500   # ASSUMPTION: the call team can phone 500 clients; change when the bank says otherwise
  bootstrap_draws: 200   # how many re-drawn exams to score when measuring the wobble

leakage_audit:
  min_rows: 50     # ASSUMPTION: a segment smaller than this is too small to judge, so it is never flagged
  flag_ratio: 3    # ASSUMPTION: flag a segment whose yes-rate is 3 times above or below the training yes-rate
  n_bins: 5        # number columns with many values are cut into this many equal-sized groups

ablations:
  # Each setup is the model trained on a different set of columns. The first one is the reference.
  # groups: from src/columns.py. extra_columns: single columns that are normally excluded.
  - name: baseline
    groups: [client, contact, history]
    extra_columns: []
  - name: without_history
    groups: [client, contact]
    extra_columns: []
  - name: plus_calendar
    groups: [client, contact, history, calendar]
    extra_columns: []
  - name: plus_economy
    groups: [client, contact, history, economy]
    extra_columns: []
  - name: plus_campaign
    groups: [client, contact, history]
    extra_columns: [campaign]
  - name: plus_duration_LEAKAGE_DEMO   # NOT allowed in a real model: only known after the call
    groups: [client, contact, history]
    extra_columns: [duration]
